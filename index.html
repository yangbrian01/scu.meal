<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>東吳學餐 MealFlow｜校園 AI 免排隊預訂管制塔</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <div id="toast" class="toast"></div>

  <!-- 頂部導覽列 -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-title-group">
        <a href="./" style="text-decoration:none; color:inherit; display:flex; align-items:center; gap:6px;">
          <span style="font-size:1.35rem;">🍱</span>
          <span style="font-weight:900; font-size:1.08rem; letter-spacing:-0.3px;">東吳學餐 MealFlow</span>
        </a>
        <span class="role-badge" id="headerRoleBadge">⚡ 系統入口導覽</span>
        <span class="sync-status" title="點擊立即同步雲端資料" style="cursor:pointer;" onclick="syncCloud(true)">
          <span class="sync-dot" id="syncDot"></span>
          <span id="syncText">已同步</span>
        </span>
      </div>

      <div class="campus-switcher" id="headerCampusSwitcher" style="display:none;">
        <button class="campus-btn active" id="btnCampus-雙溪校區" onclick="switchCampus('雙溪校區')">雙溪校區</button>
        <button class="campus-btn" id="btnCampus-城中校區" onclick="switchCampus('城中校區')">城中校區</button>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- ==================== 路由 1：根目錄角色導覽台 (/) ==================== -->
    <section id="viewPortal" class="view-section">
      <div id="portalContentBox"></div>
    </section>

    <!-- ==================== 路由 2：學生掃碼點餐頁 (/order/) ==================== -->
    <section id="viewOrder" class="view-section">
      <!-- 若本機剛點過餐且尚未完成，顯示返回該筆專屬訂單網址的快捷條 -->
      <div id="activeOrderFloatingBanner"></div>

      <!-- AI 動態分流智慧推薦橫幅 -->
      <div id="aiSmartTipBox"></div>

      <!-- 快篩標籤 -->
      <div class="filter-row">
        <button class="filter-chip active" id="filter-ALL" onclick="setFilter('ALL')">全部店家</button>
        <button class="filter-chip" id="filter-FAST" onclick="setFilter('FAST')">⚡ 免排隊快取 (綠燈順暢)</button>
        <button class="filter-chip" id="filter-PROMO" onclick="setFilter('PROMO')">🎁 AI 分流送優惠</button>
      </div>

      <!-- 餐廳列表 -->
      <div id="storeListContainer" class="store-list"></div>
    </section>

    <!-- ==================== 路由 3：專屬訂單追蹤頁 (/order/?id=ORD-xxx) ==================== -->
    <section id="viewTicket" class="view-section">
      <div id="singleTicketContainer"></div>
    </section>

    <!-- ==================== 路由 4：店家接單與分流設定 (/store/) ==================== -->
    <section id="viewStore" class="view-section">
      <!-- 店家端專屬：評審 Demo 流量模擬器 -->
      <div class="demo-sim-bar">
        <div style="font-size:0.82rem; font-weight:800; color:#FBBF24;">
          ⚡ 黑客松評審 Demo 流量模擬器：
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="demo-btn peak" onclick="triggerTrafficSim('PEAK')">🔥 模擬 12:10 尖峰塞車</button>
          <button class="demo-btn" onclick="triggerTrafficSim('NORMAL')">🌿 恢復離峰順暢</button>
        </div>
      </div>

      <div class="merchant-box" style="background:#FFF3EE; border-color:#FED7AA;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
          <div>
            <div style="font-size:0.76rem; font-weight:800; color:var(--brand);">店家專屬接單與 AI 分流控制台 (/store/)</div>
            <h2 style="font-size:1.15rem; font-weight:800;">離峰開啟優惠吸客・語音自動讀單</h2>
          </div>
          <select id="merchantSelect" class="select-input" style="width:auto;" onchange="onMerchantStoreChange()"></select>
        </div>
      </div>

      <!-- 店家 3 秒切換分流優惠 & 產能微調 -->
      <div class="merchant-box">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; flex-wrap:wrap; gap:6px;">
          <h3 style="font-size:0.98rem; font-weight:800;">🎁 當同校區友店塞車時，本店提供的 AI 分流優惠：</h3>
          <span style="font-size:0.78rem; color:var(--brand-dark); font-weight:700;" id="merchPredictLabel">🤖 AI 今日備料預測：165 份</span>
        </div>

        <div class="promo-pills">
          <button class="promo-pill-btn" id="pBtn-none" onclick="setMerchantPromo('none')">
            <div style="font-weight:800; font-size:0.88rem;">⏸️ 暫不提供優惠</div>
            <div style="font-size:0.75rem; color:var(--text-secondary);">現場滿載忙碌時關閉</div>
          </button>
          <button class="promo-pill-btn" id="pBtn-gift" onclick="setMerchantPromo('gift')">
            <div style="font-weight:800; font-size:0.88rem; color:var(--brand);">🎁 免費招待附餐/飲品</div>
            <div style="font-size:0.75rem; color:var(--text-secondary);">低食材成本・高分流吸引力</div>
          </button>
          <button class="promo-pill-btn" id="pBtn-discount" onclick="setMerchantPromo('discount')">
            <div style="font-weight:800; font-size:0.88rem; color:var(--green);">💰 每單現折 $10 元</div>
            <div style="font-size:0.75rem; color:var(--text-secondary);">直接折現吸引猶豫學生</div>
          </button>
          <button class="promo-pill-btn" id="pBtn-points" onclick="setMerchantPromo('points')">
            <div style="font-weight:800; font-size:0.88rem; color:var(--amber);">⚡ 贈送雙倍 MealPoints</div>
            <div style="font-size:0.75rem; color:var(--text-secondary);">不折損毛利・提升回購率</div>
          </button>
        </div>

        <div class="capacity-controls">
          <div>
            <label class="field-label">🍳 目前待製單數 (activeOrders)</label>
            <input type="number" id="merchActiveInput" class="select-input" min="0" max="99" value="4">
          </div>
          <div>
            <label class="field-label">⚙️ 每 15 分鐘最大產能上限</label>
            <input type="number" id="merchCapInput" class="select-input" min="5" max="100" value="20">
          </div>
        </div>

        <div style="display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;">
          <input type="text" id="merchCustomText" class="select-input" style="flex:1; min-width:200px;" placeholder="輸入分流優惠顯示文案">
          <button class="btn-tip-action" id="btnSaveMerchant" onclick="saveMerchantPromo()">💾 儲存並同步雲端</button>
        </div>
      </div>

      <!-- 店家目前待製作訂單 -->
      <div class="merchant-box">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;">
          <h3 style="font-size:0.98rem; font-weight:800;">📋 即時廚房訂單佇列 (<span id="merchActiveCount">0</span> 筆進行中)</h3>
          <div style="display:flex; gap:8px;">
            <button class="filter-chip" onclick="syncCloud(true)">🔄 刷新訂單</button>
            <button class="filter-chip" onclick="speakSample()">🔊 測試語音讀單</button>
          </div>
        </div>
        <div id="merchantOrderList"></div>
      </div>
    </section>

  </main>

  <!-- ==================== 菜單點餐抽屜 Modal ==================== -->
  <div id="menuModal" class="modal-backdrop" onclick="if(event.target===this) closeMenuModal()">
    <div class="menu-sheet">
      <div class="sheet-header">
        <div>
          <h3 style="font-size:1.15rem; font-weight:800;" id="sheetStoreName">店家名稱</h3>
          <div style="font-size:0.8rem; color:var(--text-secondary);" id="sheetStoreMeta">預計等候 5 分鐘</div>
        </div>
        <button class="sheet-close" onclick="closeMenuModal()">✕</button>
      </div>

      <div class="sheet-body">
        <div id="sheetPromoBanner" style="display:none; background:var(--brand-light); color:var(--brand-dark); padding:10px 12px; border-radius:10px; font-size:0.84rem; font-weight:700; margin-bottom:12px;"></div>
        <div id="sheetCongestedWarning" style="display:none; background:var(--red-bg); color:var(--red); padding:10px 12px; border-radius:10px; font-size:0.82rem; font-weight:700; margin-bottom:12px;"></div>
        
        <div id="sheetMenuContainer"></div>

        <div class="checkout-options">
          <div>
            <label class="field-label">⏰ 取餐時段</label>
            <select id="pickupSlotSelect" class="select-input">
              <option value="立即製作">⚡ 立即製作</option>
              <option value="12:10 下課取餐">12:10 下課取餐</option>
              <option value="12:25 預約取餐">12:25 預約取餐</option>
              <option value="13:00 離峰取餐">13:00 離峰取餐</option>
            </select>
          </div>
          <div>
            <label class="field-label">💳 付款方式</label>
            <select id="paymentSelect" class="select-input">
              <option value="LINE Pay">LINE Pay</option>
              <option value="現場現金付款">現場現金付款</option>
              <option value="街口支付">街口支付</option>
            </select>
          </div>
        </div>
      </div>

      <div class="sheet-footer">
        <div>
          <div style="font-size:0.76rem; color:var(--text-secondary);">總計金額 <span id="sheetDiscountNote" style="color:var(--brand); font-weight:700;"></span></div>
          <div style="font-size:1.4rem; font-weight:900;" id="sheetTotalPrice">$0</div>
        </div>
        <button class="btn-submit-order" id="submitOrderBtn" onclick="placeOrder()">送出預訂・領取餐號</button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
