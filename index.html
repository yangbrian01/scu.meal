<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>東吳點餐 MealFlow｜校園 AI 免排隊預訂管制塔</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 餐飲點餐專屬色系：暖陽橘 x 純淨白 x 柔和灰 */
      --brand: #FF5A1F;
      --brand-light: #FFF3EE;
      --brand-dark: #E04812;
      --green: #10B981;
      --green-bg: #ECFDF5;
      --amber: #F59E0B;
      --amber-bg: #FFFBEB;
      --red: #EF4444;
      --red-bg: #FEF2F2;
      
      --bg-page: #F8F9FA;
      --bg-card: #FFFFFF;
      --text-primary: #111827;
      --text-secondary: #6B7280;
      --text-muted: #9CA3AF;
      --border: #E5E7EB;

      --radius-xl: 20px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);
      --shadow-float: 0 12px 32px rgba(255, 90, 31, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.5;
      padding-bottom: 96px;
    }

    /* ==================== 頂部導覽列與狀態條 ==================== */
    .app-header {
      background: var(--bg-card);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .brand-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sync-status {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--bg-page);
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
    }
    .sync-dot.syncing { background: var(--amber); animation: pulse 1s infinite; }
    .sync-dot.offline { background: var(--text-muted); }

    .campus-switcher {
      display: inline-flex;
      background: var(--bg-page);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .campus-btn {
      border: none;
      background: transparent;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
      transition: 0.2s;
    }
    .campus-btn.active {
      background: var(--brand);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(255, 90, 31, 0.3);
    }

    /* Demo 模擬與身分工具列 */
    .sub-toolbar {
      background: #111827;
      color: #F9FAFB;
      padding: 8px 20px;
      font-size: 0.78rem;
    }
    .sub-toolbar-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .demo-btn-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .demo-btn {
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      color: #FFFFFF;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }
    .demo-btn:hover { background: rgba(255,255,255,0.2); }
    .demo-btn.peak {
      background: var(--brand);
      border-color: var(--brand);
    }
    .user-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #D1D5DB;
      font-weight: 600;
    }
    .user-select {
      background: rgba(255,255,255,0.12);
      color: #FFFFFF;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 0.75rem;
      font-weight: 700;
      font-family: inherit;
    }
    .user-select option { color: #111827; background: #FFFFFF; }

    /* ==================== 主容器 ==================== */
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 20px;
    }
    .view-section { display: none; }
    .view-section.active { display: block; animation: fadeIn 0.2s ease; }

    /* ==================== AI 免排隊推薦橫幅 ==================== */
    .smart-tip-card {
      background: linear-gradient(135deg, #FFF3EE 0%, #FFFBEB 100%);
      border: 1.5px solid #FED7AA;
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      box-shadow: 0 4px 14px rgba(255, 90, 31, 0.08);
    }
    .smart-tip-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--brand);
      color: #FFFFFF;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .smart-tip-title {
      font-size: 0.98rem;
      font-weight: 800;
      color: #9A3412;
      margin-bottom: 2px;
    }
    .smart-tip-desc {
      font-size: 0.84rem;
      color: #C2410C;
    }
    .btn-tip-action {
      background: var(--brand);
      color: #FFFFFF;
      border: none;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(255, 90, 31, 0.25);
      transition: 0.15s;
    }
    .btn-tip-action:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ==================== 分類快篩膠囊 ==================== */
    .filter-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 8px;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-chip {
      padding: 7px 15px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: 0.15s;
    }
    .filter-chip.active {
      background: var(--text-primary);
      color: #FFFFFF;
      border-color: var(--text-primary);
    }

    /* ==================== 餐廳列表卡片 ==================== */
    .store-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .store-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .store-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .store-card.recommended {
      border-color: #FDBA74;
      background: linear-gradient(to right, #FFFFFF 80%, #FFF7ED 100%);
    }
    .store-thumb {
      width: 76px;
      height: 76px;
      border-radius: 14px;
      background: var(--brand-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      flex-shrink: 0;
    }
    .store-info { flex: 1; min-width: 0; }
    .store-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .store-name {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .wait-pill {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .wait-free { background: var(--green-bg); color: var(--green); }
    .wait-mod { background: var(--amber-bg); color: var(--amber); }
    .wait-full { background: var(--red-bg); color: var(--red); }

    .store-meta {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .load-bar-wrap {
      width: 100%;
      height: 5px;
      background: #F3F4F6;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .load-bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }
    .promo-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--brand-light);
      color: var(--brand-dark);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 6px;
    }

    /* ==================== 點餐抽屜 (Menu Modal) ==================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.5);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; animation: fadeIn 0.2s ease; }
    .menu-sheet {
      background: var(--bg-card);
      width: 100%;
      max-width: 720px;
      border-radius: 24px 24px 0 0;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sheet-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sheet-close {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: var(--bg-page);
      font-size: 1rem;
      cursor: pointer;
    }
    .sheet-body {
      padding: 18px 20px;
      overflow-y: auto;
      flex: 1;
    }
    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .menu-item:last-child { border-bottom: none; }
    .item-title { font-size: 0.98rem; font-weight: 700; margin-bottom: 2px; }
    .item-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-secondary);
      background: var(--bg-page);
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }
    .item-price { font-size: 0.92rem; font-weight: 800; color: var(--brand); }
    .qty-stepper {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-page);
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .step-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: var(--bg-card);
      font-weight: 800;
      font-size: 1rem;
      color: var(--text-primary);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }
    .step-btn.plus { background: var(--brand); color: #FFFFFF; }

    .checkout-options {
      background: var(--bg-page);
      padding: 14px;
      border-radius: var(--radius-md);
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .field-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 4px;
      display: block;
    }
    .select-input {
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
    }
    .sheet-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg-card);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .btn-submit-order {
      flex: 1;
      background: var(--brand);
      color: #FFFFFF;
      border: none;
      padding: 14px 20px;
      border-radius: var(--radius-md);
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: var(--shadow-float);
      transition: 0.15s;
    }
    .btn-submit-order:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ==================== 取餐號碼牌卡片 ==================== */
    .ticket-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .ticket-card.ready {
      border-color: var(--green);
      background: #F0FDF4;
    }
    .ticket-card.done {
      opacity: 0.68;
      background: #F9FAFB;
    }
    .ticket-number-box {
      background: var(--brand-light);
      color: var(--brand);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      text-align: center;
      min-width: 92px;
    }
    .ticket-card.ready .ticket-number-box {
      background: var(--green);
      color: #FFFFFF;
    }
    .ticket-number-box .num {
      font-size: 1.6rem;
      font-weight: 900;
      line-height: 1.1;
    }

    /* ==================== 店家接單模式 ==================== */
    .merchant-box {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 18px;
      margin-bottom: 16px;
    }
    .promo-pills {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 12px 0;
    }
    .promo-pill-btn {
      padding: 12px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: var(--bg-page);
      text-align: left;
      cursor: pointer;
      transition: 0.15s;
    }
    .promo-pill-btn.active {
      border-color: var(--brand);
      background: var(--brand-light);
    }
    .capacity-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
    }

    /* ==================== 底部 App 導覽列 ==================== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      z-index: 150;
      padding: 8px 16px 12px;
    }
    .bottom-nav-inner {
      max-width: 500px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .tab-btn {
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 0;
    }
    .tab-btn .icon { font-size: 1.25rem; }
    .tab-btn.active { color: var(--brand); }

    /* Toast */
    .toast {
      position: fixed;
      top: 76px;
      left: 50%;
      transform: translateX(-50%);
      background: #111827;
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 600;
      z-index: 999;
      box-shadow: var(--shadow-md);
      display: none;
      max-width: 90vw;
      text-align: center;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>
</head>
<body>

  <div id="toast" class="toast"></div>

  <!-- 頂部導覽列 -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-title-group">
        <span style="font-size:1.35rem;">🍱</span>
        <span style="font-weight:900; font-size:1.08rem; letter-spacing:-0.3px;">東吳學餐 MealFlow</span>
        <span class="sync-status" id="syncStatusBadge" title="點擊立即同步雲端資料" style="cursor:pointer;" onclick="syncCloud(true)">
          <span class="sync-dot" id="syncDot"></span>
          <span id="syncText">已同步</span>
        </span>
      </div>

      <div class="campus-switcher">
        <button class="campus-btn active" id="btnCampus-雙溪校區" onclick="switchCampus('雙溪校區')">雙溪校區</button>
        <button class="campus-btn" id="btnCampus-城中校區" onclick="switchCampus('城中校區')">城中校區</button>
      </div>
    </div>
  </header>

  <!-- 評審 Demo 流量模擬與學生身分切換列 -->
  <div class="sub-toolbar">
    <div class="sub-toolbar-inner">
      <div class="demo-btn-group">
        <span style="font-weight:800; color:#FBBF24;">⚡ 評審 Demo：</span>
        <button class="demo-btn peak" id="btnSimPeak" onclick="triggerTrafficSim('PEAK')">🔥 模擬 12:10 尖峰塞車</button>
        <button class="demo-btn" id="btnSimNormal" onclick="triggerTrafficSim('NORMAL')">🌿 恢復離峰順暢</button>
      </div>
      <div class="user-badge">
        <span>👤 學生身分：</span>
        <select id="studentProfileSelect" class="user-select" onchange="switchStudentProfile(this.value)">
          <option value="15111001|楊定豊">楊定豊 (15111001)</option>
          <option value="15111002|林同學">林同學 (15111002)</option>
          <option value="15111003|陳同學">陳同學 (15111003)</option>
          <option value="ALL|全部學生(展示用)">👀 檢視全部訂單</option>
        </select>
      </div>
    </div>
  </div>

  <main class="container">

    <!-- ==================== 頁籤 1：探索點餐 ==================== -->
    <section id="viewOrder" class="view-section active">
      
      <!-- AI 動態分流智慧推薦橫幅 -->
      <div id="aiSmartTipBox"></div>

      <!-- 快篩標籤 -->
      <div class="filter-row">
        <button class="filter-chip active" id="filter-ALL" onclick="setFilter('ALL')">全部店家</button>
        <button class="filter-chip" id="filter-FAST" onclick="setFilter('FAST')">⚡ 免排隊快取 (綠燈順暢)</button>
        <button class="filter-chip" id="filter-PROMO" onclick="setFilter('PROMO')">🎁 AI 分流送優惠</button>
      </div>

      <!-- 餐廳列表 -->
      <div id="storeListContainer" class="store-list"></div>
    </section>

    <!-- ==================== 頁籤 2：我的取餐單 ==================== -->
    <section id="viewTickets" class="view-section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px;">
        <div>
          <h2 style="font-size:1.2rem; font-weight:800;">我的取餐號碼牌</h2>
          <div style="font-size:0.78rem; color:var(--text-secondary);" id="ticketOwnerHint">目前顯示：楊定豊 (15111001) 的預訂</div>
        </div>
        <button class="filter-chip" onclick="syncCloud(true)">🔄 雲端同步刷新</button>
      </div>
      <div id="ticketsContainer"></div>
    </section>

    <!-- ==================== 頁籤 3：店家接單與分流設定 ==================== -->
    <section id="viewMerchant" class="view-section">
      <div class="merchant-box" style="background:#FFF3EE; border-color:#FED7AA;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
          <div>
            <div style="font-size:0.76rem; font-weight:800; color:var(--brand);">店家 AI 流量管制與接單後台</div>
            <h2 style="font-size:1.15rem; font-weight:800;">離峰開啟優惠吸客・語音自動讀單</h2>
          </div>
          <select id="merchantSelect" class="select-input" style="width:auto;" onchange="onMerchantStoreChange()"></select>
        </div>
      </div>

      <!-- 店家 3 秒切換分流優惠 & 產能微調 -->
      <div class="merchant-box">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; flex-wrap:wrap; gap:6px;">

    // 讀取本機曾點過的訂單 ID，確保即使雲端同步也不會遺失自己剛點的識別或混入他人訂單

          studentId: '15111002', studentName: '林同學',
          itemsJson: JSON.stringify([{ id: 'M14', name: '古早味排骨特餐', price: 105, qty: 1 }]),
          subtotal: 105, discount: 0, finalTotal: 105,
          promoApplied: '🎁 AI分流招待：免費招牌冰紅茶',
          pickupTimeSlot: '12:25 預約取餐', paymentMethod: '現場現金付款', status: '可取餐',
          isDivertedOrder: true
        }
      ],
      activeStore: null,
      cart: {},
      merchantPromoMode: 'gift'
    };

    // ==================== 共用工具與前後端一致的負載演算法 ====================
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function calcPrepMinutes(activeOrders, maxCap) {
      const cap = Math.max(1, Number(maxCap) || 20);
      const act = Math.max(0, Number(activeOrders) || 0);
      const loadRatio = act / cap;
      if (act <= 2) return 3;
      const baseWait = Math.round(2 + loadRatio * 18 + (loadRatio >= 0.85 ? (loadRatio - 0.8) * 20 : 0));
      return Math.max(3, Math.min(45, baseWait));
    }

    /**
     * 確保前端店家物件具備與後端 getInitBundle 完全一致的 loadPercentage / loadState 與 AI 推薦
     */
    function enrichStoresAndAi() {
      state.stores = state.stores.map(s => {
        const cap = Math.max(1, Number(s.maxCapacityPer15Min) || 20);
        const active = Math.max(0, Number(s.activeOrders) || 0);
        const loadPct = Math.min(120, Math.round((active / cap) * 100));
        let loadState = 'FREE';
        if (loadPct >= 85) loadState = 'FULL';
        else if (loadPct >= 50) loadState = 'MODERATE';

        const avgPrep = Number(s.avgPrepMinutes) || calcPrepMinutes(active, cap);
        return {
          ...s,
          maxCapacityPer15Min: cap,
          activeOrders: active,
          avgPrepMinutes: avgPrep,
          loadPercentage: loadPct,
          loadState: loadState
        };
      });

      const recs = {};
      ['雙溪校區', '城中校區'].forEach(campus => {
        const campusStores = state.stores.filter(s => s.campus === campus);
        const congested = campusStores
          .filter(s => s.loadState === 'FULL' || s.avgPrepMinutes >= 20)
          .sort((a, b) => b.loadPercentage - a.loadPercentage || b.avgPrepMinutes - a.avgPrepMinutes);
        const availableWithPromo = campusStores
          .filter(s => s.loadState === 'FREE' && s.promoMode !== 'none')
          .sort((a, b) => a.avgPrepMinutes - b.avgPrepMinutes);

        if (congested.length > 0 && availableWithPromo.length > 0) {
          const busyStore = congested[0];
          const targetStore = availableWithPromo[0];
          recs[campus] = {
            hasAlert: true,
            congestedStoreId: busyStore.id,
            congestedStoreName: busyStore.name,
            congestedWaitMin: busyStore.avgPrepMinutes,
            congestedLoadPct: busyStore.loadPercentage,
            recommendedStoreId: targetStore.id,
            recommendedStoreName: targetStore.name,
            recommendedWaitMin: targetStore.avgPrepMinutes,
            promoMode: targetStore.promoMode,
            promoText: targetStore.promoText,
            promoDiscount: Number(targetStore.promoDiscount) || 0,
            timeSavedMin: Math.max(5, busyStore.avgPrepMinutes - targetStore.avgPrepMinutes)
          };
        } else {
          recs[campus] = { hasAlert: false };
        }
      });
      state.aiRecommendations = recs;
    }

    function setSyncState(mode, text) {
      const dot = document.getElementById('syncDot');
      const label = document.getElementById('syncText');
      if (!dot || !label) return;
      dot.className = 'sync-dot ' + (mode === 'syncing' ? 'syncing' : mode === 'offline' ? 'offline' : '');
      label.innerText = text;
    }

    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    function switchView(viewId) {
      ['viewOrder', 'viewTickets', 'viewMerchant'].forEach(id => {
        document.getElementById(id).classList.toggle('active', id === viewId);
        document.getElementById('navBtn-' + id).classList.toggle('active', id === viewId);
      });
      renderAll();

      document.getElementById('btnCampus-雙溪校區').classList.toggle('active', campus === '雙溪校區');

    // 判斷該店家目前是否適用 AI 分流優惠（未滿載且已開啟優惠）
    function isStorePromoActive(store) {
      return store && store.promoMode !== 'none' && store.loadState !== 'FULL';
    }

    // ==================== 頁籤 1：渲染學生點餐首頁 ====================
    function renderStoreList() {
      enrichStoresAndAi();
      const campusStores = state.stores.filter(s => s.campus === state.campus);
      const rec = state.aiRecommendations[state.campus];
      const tipBox = document.getElementById('aiSmartTipBox');

      if (rec && rec.hasAlert) {
        tipBox.innerHTML = `
          <div class="smart-tip-card">
            <div style="flex:1; min-width:220px;">
              <div class="smart-tip-badge">⚡ AI 流量管制塔・智慧分流建議</div>
              <div class="smart-tip-title">「${escapeHtml(rec.congestedStoreName)}」目前滿載 (${rec.congestedLoadPct}%) 需等 ${rec.congestedWaitMin} 分鐘</div>
              <div class="smart-tip-desc">
                改點 <strong>${escapeHtml(rec.recommendedStoreName)}</strong> 只要 <strong>${rec.recommendedWaitMin} 分鐘</strong>（省時 ${rec.timeSavedMin} 分），再享 <strong>${escapeHtml(rec.promoText)}</strong>
              </div>
            </div>
            <button class="btn-tip-action" onclick="openStoreMenu('${escapeHtml(rec.recommendedStoreId)}')">領優惠免排隊 ➔</button>
          </div>
        `;
      } else {
        tipBox.innerHTML = '';
      }

      // 篩選店家（與 loadState 標準統一）
      let list = campusStores;
      if (state.filter === 'FAST') list = list.filter(s => s.loadState === 'FREE');
      if (state.filter === 'PROMO') list = list.filter(s => isStorePromoActive(s));

      const container = document.getElementById('storeListContainer');
      if (list.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:36px 0;">目前無符合篩選條件的餐廳</p>`;
        return;
      }

      container.innerHTML = list.map(s => {
        let waitClass = 'wait-free';
        let waitText = `🟢 順暢・約 ${s.avgPrepMinutes} 分取餐`;
        let barColor = 'var(--green)';

        if (s.loadState === 'FULL') {
          waitClass = 'wait-full';
          waitText = `🔴 滿載久候 (${s.avgPrepMinutes}分)`;
          barColor = 'var(--red)';
        } else if (s.loadState === 'MODERATE') {
          waitClass = 'wait-mod';
          waitText = `🟡 適中・約 ${s.avgPrepMinutes} 分`;
          barColor = 'var(--amber)';
        }

        const icon = STORE_ICONS[s.id] || '🍱';
        const hasPromo = isStorePromoActive(s);
        const isRecTarget = rec && rec.hasAlert && rec.recommendedStoreId === s.id;

        return `
          <div class="store-card ${isRecTarget ? 'recommended' : ''}" onclick="openStoreMenu('${escapeHtml(s.id)}')">
            <div class="store-thumb">${icon}</div>
            <div class="store-info">
              <div class="store-header-row">
                <div class="store-name">${escapeHtml(s.name)}</div>
                <span class="wait-pill ${waitClass}">${waitText}</span>
              </div>
              <div class="store-meta">
                ⭐ ${s.rating} ・ ${escapeHtml(s.category)} ・ 待製 ${s.activeOrders}/${s.maxCapacityPer15Min} 單 (負載 ${s.loadPercentage}%)
              </div>
              <div class="load-bar-wrap">
                <div class="load-bar-fill" style="width:${Math.min(100, s.loadPercentage)}%; background:${barColor};"></div>
              </div>
              ${hasPromo ? `<div class="promo-tag">${escapeHtml(s.promoText)}</div>` : ''}

    // ==================== 點餐抽屜 Modal ====================
    function openStoreMenu(storeId) {
      const store = state.stores.find(s => s.id === storeId);
      if (!store) return;

      state.activeStore = store;
      state.cart = {};
      if (store.menus && store.menus.length > 0) {
        state.cart[store.menus[0].id] = 1;
      }

      document.getElementById('sheetStoreName').innerText = store.name;
      document.getElementById('sheetStoreMeta').innerText =
        `${store.campus} ・ 目前待製 ${store.activeOrders} 單（預估約 ${store.avgPrepMinutes} 分鐘取餐）`;

      const promoBanner = document.getElementById('sheetPromoBanner');
      if (isStorePromoActive(store)) {
        promoBanner.style.display = 'block';
        promoBanner.innerText = `🎉 本單已自動套用分流優惠：${store.promoText}`;
      } else {
        promoBanner.style.display = 'none';
      }

      const congestedWarn = document.getElementById('sheetCongestedWarning');
      const rec = state.aiRecommendations[store.campus];
      if (store.loadState === 'FULL' && rec && rec.hasAlert && rec.recommendedStoreId !== store.id) {
        congestedWarn.style.display = 'block';
        congestedWarn.innerHTML = `⚠️ 本店目前產能滿載 (${store.loadPercentage}%)，需等候約 ${store.avgPrepMinutes} 分鐘。建議改點「<a href="javascript:void(0)" style="color:inherit;text-decoration:underline;" onclick="openStoreMenu('${escapeHtml(rec.recommendedStoreId)}')">${escapeHtml(rec.recommendedStoreName)}</a>」僅需 ${rec.recommendedWaitMin} 分鐘並享優惠！`;
      } else {
        congestedWarn.style.display = 'none';
      }

      renderSheetMenu();
      document.getElementById('menuModal').classList.add('open');
    }

    function closeMenuModal() {
      document.getElementById('menuModal').classList.remove('open');
    }

    function changeQty(menuId, delta) {
      const cur = state.cart[menuId] || 0;
      const next = Math.max(0, cur + delta);
      if (next === 0) delete state.cart[menuId];
      else state.cart[menuId] = next;
      renderSheetMenu();
    }

    function renderSheetMenu() {
      const store = state.activeStore;
      if (!store) return;

      let subtotal = 0;
      const html = (store.menus || []).map(m => {
        const qty = state.cart[m.id] || 0;
        subtotal += m.price * qty;
        return `
          <div class="menu-item">
            <div>
              <div class="item-title">
                ${escapeHtml(m.name)}
                ${m.tag ? `<span class="item-tag">${escapeHtml(m.tag)}</span>` : ''}
              </div>
              <div class="item-price">$${m.price}</div>
            </div>
            <div class="qty-stepper">
              <button class="step-btn" onclick="changeQty('${escapeHtml(m.id)}', -1)">－</button>
              <span style="font-weight:800; min-width:18px; text-align:center;">${qty}</span>
              <button class="step-btn plus" onclick="changeQty('${escapeHtml(m.id)}', 1)">＋</button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('sheetMenuContainer').innerHTML = html;

      let discount = 0;
      const noteEl = document.getElementById('sheetDiscountNote');
      if (subtotal > 0 && isStorePromoActive(store) && store.promoMode === 'discount') {
        discount = Number(store.promoDiscount) || 10;
        noteEl.innerText = `(已折抵 -$${discount})`;
      } else {
        noteEl.innerText = '';
      }

      document.getElementById('sheetTotalPrice').innerText = `$${Math.max(0, subtotal - discount)}`;
    }

    async function placeOrder() {
      const store = state.activeStore;
      if (!store) return;

      const items = [];
      let subtotal = 0;
      (store.menus || []).forEach(m => {
        const q = state.cart[m.id] || 0;
        if (q > 0) {
          items.push({ id: m.id, name: m.name, price: m.price, qty: q });
          subtotal += m.price * q;
        }
      });

      if (items.length === 0) {
        showToast('⚠️ 請至少選擇一項餐點');
        return;
      }

      const btn = document.getElementById('submitOrderBtn');
      btn.disabled = true;
      btn.innerText = '⏳ 正在傳送訂單至廚房...';

      const promoActive = isStorePromoActive(store);
      const discount = (promoActive && store.promoMode === 'discount') ? (Number(store.promoDiscount) || 10) : 0;
      const finalTotal = Math.max(0, subtotal - discount);
      const promoApplied = promoActive ? store.promoText : '一般預訂';
      const pickupTimeSlot = document.getElementById('pickupSlotSelect').value;
      const paymentMethod = document.getElementById('paymentSelect').value;

      // 先產生一組唯一 orderId 與 pickupNumber 傳給後端，確保前後端 100% 同步一致
      const orderId = 'ORD-' + Math.floor(100000 + Math.random() * 900000);
      const prefix = store.campus === '城中校區' ? 'C' : 'S';
      const pickupNumber = prefix + String(Math.floor(100 + Math.random() * 899));

      const orderStudentId = state.studentId === 'ALL' ? '15111001' : state.studentId;
      const orderStudentName = state.studentId === 'ALL' ? '楊定豊' : state.studentName;

      const newOrder = {
        orderId,
        pickupNumber,
        storeId: store.id,
        storeName: store.name,
        studentId: orderStudentId,
        studentName: orderStudentName,
        itemsJson: JSON.stringify(items),
        subtotal,
        discount,
        finalTotal,
        promoApplied,
        pickupTimeSlot,
        paymentMethod,
        status: '製作中',
        isDivertedOrder: promoActive
      };

      try {
        setSyncState('syncing', '傳送訂單中...');
        const res = await fetch(GAS_URL, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'submitOrder',
            orderId,
            pickupNumber,
            campus: store.campus,
            storeId: store.id,
            storeName: store.name,
            studentId: orderStudentId,
            studentName: orderStudentName,
            items,
            subtotal,
            discount,
            finalTotal,
            promoApplied,
            paymentMethod,
            pickupTimeSlot,
            isDivertedOrder: promoActive
          })
        });
        const data = await res.json();
        if (!data || data.success === false) {
          throw new Error((data && data.message) || '後端寫入失敗');
        }
        // 以後端回傳的確認號碼為準（若舊版後端未讀 params.pickupNumber 也能自動對齊！）
        if (data.order) {
          newOrder.orderId = data.order.orderId || newOrder.orderId;
          newOrder.pickupNumber = data.order.pickupNumber || newOrder.pickupNumber;
        }
        setSyncState('online', '已同步');
      } catch (e) {
        setSyncState('offline', '離線暫存模式');
      } finally {
        btn.disabled = false;
        btn.innerText = '送出預訂・領取餐號';
      }

      saveMyOrderId(newOrder.orderId);
      state.orders.unshift(newOrder);
      store.activeOrders += 1;
      store.avgPrepMinutes = calcPrepMinutes(store.activeOrders, store.maxCapacityPer15Min);

      closeMenuModal();
      switchView('viewTickets');
      showToast(`✅ 預訂成功！取餐號碼：${newOrder.pickupNumber}`);
    }

    // ==================== 頁籤 2：渲染我的取餐號碼牌（依學生身分過濾） ====================

    // ==================== 頁籤 3：店家接單與 AI 分流設定 ====================
    function initMerchantSelect() {
      const sel = document.getElementById('merchantSelect');
      const currentVal = sel.value || 'S02';
      sel.innerHTML = state.stores.map(s => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.campus)}｜${escapeHtml(s.name)}</option>`).join('');
      sel.value = state.stores.some(s => s.id === currentVal) ? currentVal : state.stores[0].id;
    }

    function onMerchantStoreChange() {
      const storeId = document.getElementById('merchantSelect').value;
      const store = state.stores.find(s => s.id === storeId) || state.stores[0];
      if (!store) return;
      setMerchantPromo(store.promoMode || 'none', false);
      document.getElementById('merchCustomText').value = store.promoText || '';
      document.getElementById('merchActiveInput').value = store.activeOrders;
      document.getElementById('merchCapInput').value = store.maxCapacityPer15Min;
      renderMerchantOrdersOnly();
    }

    function renderMerchantView() {
      initMerchantSelect();
      const storeId = document.getElementById('merchantSelect').value;
      const store = state.stores.find(s => s.id === storeId) || state.stores[0];
      if (!store) return;

      document.getElementById('merchPredictLabel').innerText =
        `🤖 AI 今日備料預測：${store.predictedDailyOrders || 160} 份｜目前負載 ${store.loadPercentage || 0}%`;
      setMerchantPromo(store.promoMode || 'none', false);
      document.getElementById('merchCustomText').value = store.promoText || '';
      document.getElementById('merchActiveInput').value = store.activeOrders;
      document.getElementById('merchCapInput').value = store.maxCapacityPer15Min;

      renderMerchantOrdersOnly();
    }

    function renderMerchantOrdersOnly() {
      const storeId = document.getElementById('merchantSelect').value;
      const store = state.stores.find(s => s.id === storeId) || state.stores[0];
      if (!store) return;

      const storeOrders = state.orders.filter(o => o.storeId === store.id);
      const pendingOrders = storeOrders.filter(o => o.status !== '已完成');
      document.getElementById('merchActiveCount').innerText = pendingOrders.length;

      const listEl = document.getElementById('merchantOrderList');
      if (storeOrders.length === 0) {
        listEl.innerHTML = '<p style="color:var(--text-muted); font-size:0.86rem; text-align:center; padding:18px;">目前無待製餐點</p>';
        return;
      }

      // 改用 orderId 查找訂單進行語音播報，徹底避免餐點名稱含單引號/特殊字元造成 onclick 語法崩潰
      listEl.innerHTML = storeOrders.map(o => {
        let items = [];
        try { items = JSON.parse(o.itemsJson || '[]'); } catch (e) {}
        const itemText = items.map(i => `${i.name} x${i.qty}`).join('、');
        const isReady = o.status === '可取餐';
        const isDone = o.status === '已完成';

        return `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); gap:10px; flex-wrap:wrap; ${isDone ? 'opacity:0.55;' : ''}">
            <div style="flex:1; min-width:200px;">
              <strong style="color:var(--brand); font-size:1rem;">#${escapeHtml(o.pickupNumber)}</strong>
              <span class="wait-pill ${isReady ? 'wait-free' : isDone ? '' : 'wait-mod'}" style="margin-left:6px;">${escapeHtml(o.status)}</span>
              <span style="font-weight:700; margin-left:6px;">${escapeHtml(itemText)}</span>
              <div style="font-size:0.78rem; color:var(--text-secondary); margin-top:2px;">
                👤 ${escapeHtml(o.studentName || '同學')} ・ ${escapeHtml(o.promoApplied)} ・ ${escapeHtml(o.pickupTimeSlot)} ・ $${o.finalTotal}
              </div>
            </div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              <button class="filter-chip" onclick="speakOrderById('${escapeHtml(o.orderId)}')">🔊 讀單</button>
              ${o.status === '製作中' ? `
                <button class="btn-tip-action" style="padding:6px 12px; font-size:0.8rem;" onclick="updateOrderStatus('${escapeHtml(o.orderId)}', '可取餐')">🔔 通知取餐</button>
              ` : ''}
              ${o.status !== '已完成' ? `
                <button class="filter-chip" style="border-color:var(--green); color:var(--green);" onclick="updateOrderStatus('${escapeHtml(o.orderId)}', '已完成')">✅ 完成結單</button>
              ` : ''}

    function setMerchantPromo(mode, autoFill = true) {
      state.merchantPromoMode = mode;
      ['none', 'gift', 'discount', 'points'].forEach(k => {
        const el = document.getElementById('pBtn-' + k);
        if (el) el.classList.toggle('active', k === mode);
      });
      if (autoFill) {
        const input = document.getElementById('merchCustomText');
        if (mode === 'none') input.value = '無優惠';
        if (mode === 'gift') input.value = '🎁 AI分流招待：免費招牌冰紅茶/溫泉蛋';
        if (mode === 'discount') input.value = '💰 AI分流折抵：現折 $10 元';
        if (mode === 'points') input.value = '⚡ AI分流回饋：雙倍 MealPoints 點數';
      }
    }

    async function saveMerchantPromo() {
      const storeId = document.getElementById('merchantSelect').value;
      const store = state.stores.find(s => s.id === storeId);
      if (!store) return;

      const newActive = Math.max(0, Number(document.getElementById('merchActiveInput').value) || 0);
      const newCap = Math.max(5, Number(document.getElementById('merchCapInput').value) || 20);

      store.promoMode = state.merchantPromoMode;
      store.promoText = document.getElementById('merchCustomText').value.trim() || '無優惠';
      store.promoDiscount = state.merchantPromoMode === 'discount' ? 10 : 0;
      store.activeOrders = newActive;
      store.maxCapacityPer15Min = newCap;
      store.avgPrepMinutes = calcPrepMinutes(newActive, newCap);

      renderAll();
      showToast(`✅ 已更新「${store.name}」的分流優惠與產能設定！`);

      const btn = document.getElementById('btnSaveMerchant');
      btn.disabled = true;
      try {
        setSyncState('syncing', '儲存設定中...');
        const res = await fetch(GAS_URL, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'updateStoreConfig',
            storeId: store.id,
            promoMode: store.promoMode,
            promoText: store.promoText,
            promoDiscount: store.promoDiscount,
            activeOrders: store.activeOrders,
            maxCapacityPer15Min: store.maxCapacityPer15Min
          })
        });
        const data = await res.json();
        if (data && data.bundle) applyCloudBundle(data.bundle);
        setSyncState('online', '已同步');
      } catch (e) {
        setSyncState('offline', '離線暫存模式');
      } finally {
        btn.disabled = false;
      }
    }

    /**
     * 更新訂單狀態（製作中 -> 可取餐 -> 已完成），並同步寫回 Google Sheet 與扣減店家排隊單數
     */
    async function updateOrderStatus(orderId, newStatus) {
      const ord = state.orders.find(o => o.orderId === orderId);
      if (!ord) return;

      const oldStatus = ord.status;
      ord.status = newStatus;

      // 當從「製作中」完成製作進入「可取餐」或「已完成」時，同步釋放店家待製單數 (-1)
      const store = state.stores.find(s => s.id === ord.storeId);
      if (store && oldStatus === '製作中' && (newStatus === '可取餐' || newStatus === '已完成') && !ord._capacityReleased) {
        ord._capacityReleased = true;
        store.activeOrders = Math.max(0, (Number(store.activeOrders) || 1) - 1);
        store.avgPrepMinutes = calcPrepMinutes(store.activeOrders, store.maxCapacityPer15Min);
      }

      renderAll();

      if (newStatus === '可取餐') {
        speakOrder(ord.pickupNumber, '餐點已製作完成，請至快速櫃檯取餐');
        showToast(`🔔 已通知 #${ord.pickupNumber} 取餐並同步雲端`);
      } else {
        showToast(`✅ 訂單 #${ord.pickupNumber} 已完成取餐結單`);
      }

      try {
        setSyncState('syncing', '更新訂單狀態...');
        const res = await fetch(GAS_URL, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'updateOrderStatus',
            orderId: ord.orderId,
            newStatus: newStatus
          })
        });
        const data = await res.json();
        if (data && data.bundle) applyCloudBundle(data.bundle);
        setSyncState('online', '已同步');
      } catch (e) {
        setSyncState('offline', '離線暫存模式');
      }
    }

    // ==================== 評審 Demo：一鍵模擬尖峰塞車 vs 離峰順暢 ====================
    async function triggerTrafficSim(mode) {
      // 立即更新前端狀態讓 Demo 零延遲反應
      state.stores.forEach(s => {
        if (mode === 'PEAK') {
          if (s.id === 'S01') { s.activeOrders = 18; s.avgPrepMinutes = 24; }
          else if (s.id === 'S03') { s.activeOrders = 21; s.avgPrepMinutes = 18; }
          else if (s.id === 'S05') { s.activeOrders = 16; s.avgPrepMinutes = 26; }
          else if (s.id === 'S02' || s.id === 'S06') { s.activeOrders = 3; s.avgPrepMinutes = 4; }
          else { s.activeOrders = 5; s.avgPrepMinutes = 5; }
        } else {
          s.activeOrders = 4;
          s.avgPrepMinutes = 5;
        }
      });

      renderAll();
      showToast(mode === 'PEAK'
        ? '🔥 已啟動「中午 12:10 尖峰塞車」情境！AI 分流引擎已觸發'
        : '🌿 已恢復全校區離峰順暢狀態！');

      try {
        setSyncState('syncing', '同步模擬情境...');
        const res = await fetch(GAS_URL, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'simulateTraffic', mode })
        });
        const data = await res.json();
        if (data && data.bundle) applyCloudBundle(data.bundle);
        setSyncState('online', '已同步');
      } catch (e) {
        setSyncState('offline', '離線模擬模式');
      }
    }

    // ==================== 語音讀單（安全防跳脫字元） ====================
    function speakOrderById(orderId) {
      const ord = state.orders.find(o => o.orderId === orderId);
      if (!ord) return;
      let items = [];
      try { items = JSON.parse(ord.itemsJson || '[]'); } catch (e) {}
      const itemText = items.map(i => `${i.name} ${i.qty} 份`).join('，');
      speakOrder(ord.pickupNumber, `${itemText}，${ord.promoApplied}`);
    }

    function speakOrder(pickupNo, text) {
      if (!('speechSynthesis' in window)) {
        showToast('⚠️ 您的瀏覽器不支援語音合成');
        return;
      }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(`取餐號 ${pickupNo}，${text}`);
      u.lang = 'zh-TW';
      window.speechSynthesis.speak(u);
    }

    function speakSample() {
      speakOrder('S208', '炙燒起司牛五花丼一份，AI分流招待免費溫泉蛋乙顆');
      showToast('🔊 正在播放廚房語音讀單');
    }

    // ==================== 雲端同步與資料合併 ====================
    function applyCloudBundle(bundle) {
      if (!bundle) return;
      if (Array.isArray(bundle.stores) && bundle.stores.length > 0) {
        state.stores = bundle.stores;
      }
      if (Array.isArray(bundle.orders) && bundle.orders.length > 0) {
        // 合併雲端訂單與本機剛建立但尚未寫入完成的訂單
        const cloudIds = new Set(bundle.orders.map(o => o.orderId));
        const localUnsynced = state.orders.filter(o => !cloudIds.has(o.orderId));
        state.orders = [...localUnsynced, ...bundle.orders];
      }
      renderAll();
    }

    async function syncCloud(showFeedback = false) {
      try {
        setSyncState('syncing', '同步中...');
        const res = await fetch(GAS_URL, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'initBundle' })
        });
        const data = await res.json();
        if (data && data.bundle) {
          applyCloudBundle(data.bundle);
          setSyncState('online', '已同步');
          if (showFeedback) showToast('🔄 已與雲端資料庫同步最新狀態');
        }
      } catch (e) {
        setSyncState('offline', '離線模式');
        if (showFeedback) showToast('⚠️ 目前使用離線快取資料展示');
      }
    }

    function renderAll() {
      enrichStoresAndAi();
      renderStoreList();
      renderTickets();
      renderMerchantView();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderAll();
      syncCloud(false);
    });
  </script>
</body>
</html>
