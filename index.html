<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>東吳點餐 MealFlow｜校園免排隊預訂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 餐飲點餐專屬色系：暖陽橘 x 純淨白 x 柔和灰 */
      --brand: #FF5A1F;
      --brand-light: #FFF3EE;
      --brand-dark: #E04812;
      --green: #10B981;
      --green-bg: #ECFDF5;
      --amber: #F59E0B;
      --amber-bg: #FFFBEB;
      --red: #EF4444;
      --red-bg: #FEF2F2;
      
      --bg-page: #F8F9FA;
      --bg-card: #FFFFFF;
      --text-primary: #111827;
      --text-secondary: #6B7280;
      --text-muted: #9CA3AF;
      --border: #E5E7EB;

      --radius-xl: 20px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);
      --shadow-float: 0 12px 32px rgba(255, 90, 31, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.5;
      padding-bottom: 90px;
    }

    /* ==================== 頂部極簡導覽列 ==================== */
    .app-header {
      background: var(--bg-card);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .campus-switcher {
      display: inline-flex;
      background: var(--bg-page);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .campus-btn {
      border: none;
      background: transparent;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
      transition: 0.2s;
    }
    .campus-btn.active {
      background: var(--brand);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(255, 90, 31, 0.3);
    }
    .sync-status {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ==================== 主容器 ==================== */
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 20px;
    }
    .view-section { display: none; }
    .view-section.active { display: block; animation: fadeIn 0.2s ease; }

    /* ==================== AI 免排隊推薦橫幅（清爽型） ==================== */
    .smart-tip-card {
      background: linear-gradient(135deg, #FFF3EE 0%, #FFFBEB 100%);
      border: 1.5px solid #FED7AA;
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .smart-tip-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--brand);
      color: #FFFFFF;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .smart-tip-title {
      font-size: 0.98rem;
      font-weight: 800;
      color: #9A3412;
      margin-bottom: 2px;
    }
    .smart-tip-desc {
      font-size: 0.84rem;
      color: #C2410C;
    }
    .btn-tip-action {
      background: var(--brand);
      color: #FFFFFF;
      border: none;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(255, 90, 31, 0.25);
    }

    /* ==================== 分類快篩膠囊 ==================== */
    .filter-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 8px;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-chip {
      padding: 7px 15px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
    }
    .filter-chip.active {
      background: var(--text-primary);
      color: #FFFFFF;
      border-color: var(--text-primary);
    }

    /* ==================== 餐廳列表卡片 ==================== */
    .store-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .store-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .store-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .store-thumb {
      width: 76px;
      height: 76px;
      border-radius: 14px;
      background: var(--brand-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      flex-shrink: 0;
    }
    .store-info { flex: 1; min-width: 0; }
    .store-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .store-name {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .wait-pill {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .wait-free { background: var(--green-bg); color: var(--green); }
    .wait-mod { background: var(--amber-bg); color: var(--amber); }
    .wait-full { background: var(--red-bg); color: var(--red); }

    .store-meta {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .promo-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--brand-light);
      color: var(--brand-dark);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 6px;
    }

    /* ==================== 點餐抽屜 (Menu Modal) ==================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.5);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; animation: fadeIn 0.2s ease; }
    .menu-sheet {
      background: var(--bg-card);
      width: 100%;
      max-width: 720px;
      border-radius: 24px 24px 0 0;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sheet-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sheet-close {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: var(--bg-page);
      font-size: 1rem;
      cursor: pointer;
    }
    .sheet-body {
      padding: 18px 20px;
      overflow-y: auto;
      flex: 1;
    }
    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .menu-item:last-child { border-bottom: none; }
    .item-title { font-size: 0.98rem; font-weight: 700; margin-bottom: 2px; }
    .item-price { font-size: 0.92rem; font-weight: 800; color: var(--brand); }
    .qty-stepper {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-page);
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .step-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: var(--bg-card);
      font-weight: 800;
      font-size: 1rem;
      color: var(--text-primary);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }
    .step-btn.plus { background: var(--brand); color: #FFFFFF; }

    .checkout-options {
      background: var(--bg-page);
      padding: 14px;
      border-radius: var(--radius-md);
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .field-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 4px;
      display: block;
    }
    .select-input {
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
    }
    .sheet-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg-card);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .btn-submit-order {
      flex: 1;
      background: var(--brand);
      color: #FFFFFF;
      border: none;
      padding: 14px 20px;
      border-radius: var(--radius-md);
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: var(--shadow-float);
    }

    /* ==================== 取餐號碼牌卡片 ==================== */
    .ticket-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .ticket-number-box {
      background: var(--brand-light);
      color: var(--brand);
      padding: 12px 18px;
      border-radius: var(--radius-md);
      text-align: center;
      min-width: 92px;
    }
    .ticket-number-box .num {
      font-size: 1.65rem;
      font-weight: 900;
      line-height: 1.1;
    }

    /* ==================== 店家接單模式 (乾淨實用版) ==================== */
    .merchant-box {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 18px;
      margin-bottom: 16px;
    }
    .promo-pills {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 12px 0;
    }
    .promo-pill-btn {
      padding: 12px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: var(--bg-page);
      text-align: left;
      cursor: pointer;
    }
    .promo-pill-btn.active {
      border-color: var(--brand);
      background: var(--brand-light);
    }

    /* ==================== 底部 App 導覽列 ==================== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      z-index: 150;
      padding: 8px 16px 12px;
    }
    .bottom-nav-inner {
      max-width: 500px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .tab-btn {
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 0;
    }
    .tab-btn .icon { font-size: 1.25rem; }
    .tab-btn.active { color: var(--brand); }

    /* Toast */
    .toast {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: #111827;
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 600;
      z-index: 999;
      box-shadow: var(--shadow-md);
      display: none;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  </style>
</head>
<body>

  <div id="toast" class="toast"></div>

  <!-- 頂部導覽列 -->
  <header class="app-header">
    <div class="header-inner">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:1.35rem;">🍱</span>
        <span style="font-weight:900; font-size:1.1rem; letter-spacing:-0.3px;">東吳學餐快點</span>
      </div>

      <div class="campus-switcher">
        <button class="campus-btn active" id="btnCampus-雙溪校區" onclick="switchCampus('雙溪校區')">雙溪校區</button>
        <button class="campus-btn" id="btnCampus-城中校區" onclick="switchCampus('城中校區')">城中校區</button>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- ==================== 頁籤 1：探索點餐 ==================== -->
    <section id="viewOrder" class="view-section active">
      
      <!-- 清爽型 AI 免排隊推薦卡 -->
      <div id="aiSmartTipBox"></div>

      <!-- 快篩標籤 -->
      <div class="filter-row">
        <button class="filter-chip active" id="filter-ALL" onclick="setFilter('ALL')">全部店家</button>
        <button class="filter-chip" id="filter-FAST" onclick="setFilter('FAST')">⚡ 免排隊快取 (&le;6分鐘)</button>
        <button class="filter-chip" id="filter-PROMO" onclick="setFilter('PROMO')">🎁 分流送優惠</button>
      </div>

      <!-- 餐廳列表 -->
      <div id="storeListContainer" class="store-list"></div>
    </section>

    <!-- ==================== 頁籤 2：我的取餐單 ==================== -->
    <section id="viewTickets" class="view-section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h2 style="font-size:1.2rem; font-weight:800;">我的取餐號碼牌</h2>
        <button class="filter-chip" onclick="syncCloud()">🔄 重新整理</button>
      </div>
      <div id="ticketsContainer"></div>
    </section>

    <!-- ==================== 頁籤 3：店家接單與分流設定 ==================== -->
    <section id="viewMerchant" class="view-section">
      <div class="merchant-box" style="background:#FFF3EE; border-color:#FED7AA;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
          <div>
            <div style="font-size:0.76rem; font-weight:800; color:var(--brand);">店家簡易接單後台</div>
            <h2 style="font-size:1.15rem; font-weight:800;">離峰開啟優惠吸客・語音自動讀單</h2>
          </div>
          <select id="merchantSelect" class="select-input" style="width:auto;" onchange="renderMerchantView()"></select>
        </div>
      </div>

      <!-- 店家 3 秒切換分流優惠 -->
      <div class="merchant-box">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <h3 style="font-size:0.98rem; font-weight:800;">🎁 當隔壁塞車時，本店提供的分流優惠：</h3>
          <span style="font-size:0.78rem; color:var(--text-secondary);" id="merchPredictLabel">今日預估：165 份</span>
        </div>

        <div class="promo-pills">
          <button class="promo-pill-btn" id="pBtn-none" onclick="setMerchantPromo('none')">
            <div style="font-weight:800; font-size:0.88rem;">⏸️ 暫不提供優惠</div>
            <div style="font-size:0.75rem; color:var(--text-secondary);">現場忙碌時關閉</div>
          </button>
          <button class="promo-pill-btn" id="pBtn-gift" onclick="setMerchantPromo('gift')">
            <div style="font-weight:800; font-size:0.88rem; color:var(--brand);">🎁 免費送附餐/紅茶</div>
            <div style="font-size:0.75rem; color:var(--text-secondary);">低成本高吸引力</div>
          </button>
          <button class="promo-pill-btn" id="pBtn-discount" onclick="setMerchantPromo('discount')">
            <div style="font-weight:800; font-size:0.88rem; color:var(--green);">💰 每單現折 $10 元</div>
            <div style="font-size:0.75rem; color:var(--text-secondary);">直接折現吸引學生</div>
          </button>
          <button class="promo-pill-btn" id="pBtn-points" onclick="setMerchantPromo('points')">
            <div style="font-weight:800; font-size:0.88rem; color:var(--amber);">🪙 贈送雙倍點數</div>
            <div style="font-size:0.75rem; color:var(--text-secondary);">不折損店內利潤</div>
          </button>
        </div>

        <div style="display:flex; gap:10px; margin-top:10px;">
          <input type="text" id="merchCustomText" class="select-input" style="flex:1;" placeholder="優惠顯示文字">
          <button class="btn-tip-action" onclick="saveMerchantPromo()">儲存設定</button>
        </div>
      </div>

      <!-- 店家目前待製作訂單 -->
      <div class="merchant-box">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <h3 style="font-size:0.98rem; font-weight:800;">📋 即時訂單與語音出單</h3>
          <button class="filter-chip" onclick="speakSample()">🔊 測試廚房語音播報</button>
        </div>
        <div id="merchantOrderList"></div>
      </div>
    </section>

  </main>

  <!-- ==================== 菜單點餐抽屜 Modal ==================== -->
  <div id="menuModal" class="modal-backdrop" onclick="if(event.target===this) closeMenuModal()">
    <div class="menu-sheet">
      <div class="sheet-header">
        <div>
          <h3 style="font-size:1.15rem; font-weight:800;" id="sheetStoreName">店家名稱</h3>
          <div style="font-size:0.8rem; color:var(--text-secondary);" id="sheetStoreMeta">預計等候 5 分鐘</div>
        </div>
        <button class="sheet-close" onclick="closeMenuModal()">✕</button>
      </div>

      <div class="sheet-body">
        <div id="sheetPromoBanner" style="display:none; background:var(--brand-light); color:var(--brand-dark); padding:10px 12px; border-radius:10px; font-size:0.84rem; font-weight:700; margin-bottom:12px;"></div>
        
        <div id="sheetMenuContainer"></div>

        <div class="checkout-options">
          <div>
            <label class="field-label">⏰ 取餐時間</label>
            <select id="pickupSlotSelect" class="select-input">
              <option value="立即製作 (約5分鐘)">⚡ 立即製作</option>
              <option value="12:10 下課取餐">12:10 下課取餐</option>
              <option value="12:25 預約取餐">12:25 預約取餐</option>
            </select>
          </div>
          <div>
            <label class="field-label">💳 付款方式</label>
            <select id="paymentSelect" class="select-input">
              <option value="LINE Pay">LINE Pay</option>
              <option value="現場現金付款">現場付現</option>
            </select>
          </div>
        </div>
      </div>

      <div class="sheet-footer">
        <div>
          <div style="font-size:0.76rem; color:var(--text-secondary);">總計金額 <span id="sheetDiscountNote" style="color:var(--brand); font-weight:700;"></span></div>
          <div style="font-size:1.4rem; font-weight:900;" id="sheetTotalPrice">$0</div>
        </div>
        <button class="btn-submit-order" id="submitOrderBtn" onclick="placeOrder()">送出預訂・領取餐號</button>
      </div>
    </div>
  </div>

  <!-- ==================== 底部 App 導覽列 ==================== -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <button class="tab-btn active" id="navBtn-viewOrder" onclick="switchView('viewOrder')">
        <span class="icon">🍔</span>
        <span>探索點餐</span>
      </button>
      <button class="tab-btn" id="navBtn-viewTickets" onclick="switchView('viewTickets')">
        <span class="icon">🎟️</span>
        <span>我的取餐單 (<span id="ticketCount">1</span>)</span>
      </button>
      <button class="tab-btn" id="navBtn-viewMerchant" onclick="switchView('viewMerchant')">
        <span class="icon">🏪</span>
        <span>店家接單端</span>
      </button>
    </div>
  </nav>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzVXQRKZfnhgM_BhW6pgy1VOCg7YmCdfnAdHOS_9Tt7agxQa2r69hwg1UGL73gpoVwp/exec';

    const STORE_ICONS = {

      'S05': '🍛', 'S06': '🥩', 'S07': '🍜'
    };

    const DEFAULT_STORES = [
      {

        menus: [

          { id: 'M03', name: '經典鮪魚玉米飯捲', price: 65 }
        ]
      },
      {

        maxCapacityPer15Min: 20, activeOrders: 4, avgPrepMinutes: 5,
        promoMode: 'gift', promoText: '🎁 免排隊招待：免費溫泉蛋乙顆', promoDiscount: 0, predictedDailyOrders: 165, rating: 4.7,
        menus: [
          { id: 'M04', name: '炙燒起司牛五花丼', price: 115 },

          { id: 'M06', name: '讚岐胡麻冷烏龍麵', price: 95 }
        ]
      },
      {
        id: 'S03', campus: '雙溪校區', name: '雙溪-四海遊龍', category: '鍋貼水餃・湯品',
        maxCapacityPer15Min: 25, activeOrders: 14, avgPrepMinutes: 12,
        promoMode: 'none', promoText: '無優惠', promoDiscount: 0, predictedDailyOrders: 210, rating: 4.6,
        menus: [
          { id: 'M07', name: '招牌鍋貼套餐 (10顆+酸辣湯)', price: 105 },

        ]
      },
      {

        promoMode: 'discount', promoText: '💰 免排隊折抵：現折 $10 元', promoDiscount: 10, predictedDailyOrders: 150, rating: 4.8,
        menus: [
          { id: 'M09', name: '秘製椒麻雞腿飯', price: 110 },
          { id: 'M10', name: '蒜泥白肉精緻便當', price: 100 }
        ]
      },
      {
        id: 'S05', campus: '城中校區', name: '城中-咖哩食堂', category: '熟成咖哩・炸物',
        maxCapacityPer15Min: 15, activeOrders: 15, avgPrepMinutes: 25,
        promoMode: 'none', promoText: '無優惠', promoDiscount: 0, predictedDailyOrders: 195, rating: 4.8,
        menus: [
          { id: 'M11', name: '唐揚炸雞熟成咖哩飯', price: 125 },
          { id: 'M12', name: '手打漢堡排歐姆蛋咖哩', price: 135 }
        ]
      },
      {
        id: 'S06', campus: '城中校區', name: '城中-吳葉食堂', category: '精緻台式簡餐',
        maxCapacityPer15Min: 20, activeOrders: 3, avgPrepMinutes: 4,
        promoMode: 'gift', promoText: '🎁 免排隊招待：免費招牌冰紅茶', promoDiscount: 0, predictedDailyOrders: 145, rating: 4.9,
        menus: [
          { id: 'M13', name: '蔥爆牛肉鐵板簡餐', price: 115 },
          { id: 'M14', name: '古早味排骨特餐', price: 105 },
          { id: 'M15', name: '手工鮮蝦紅油抄手麵', price: 90 }
        ]
      },
      {
        id: 'S07', campus: '城中校區', name: '大熊涼麵 X 吃好食堂', category: '手工涼麵・味噌湯',
        maxCapacityPer15Min: 25, activeOrders: 5, avgPrepMinutes: 3,
        promoMode: 'points', promoText: '🪙 免排隊回饋：雙倍點數', promoDiscount: 0, predictedDailyOrders: 160, rating: 4.7,
        menus: [
          { id: 'M16', name: '川味麻辣雞絲涼麵 (大)', price: 75 },
          { id: 'M17', name: '綜合三合一味噌湯', price: 45 }
        ]
      }
    ];

    let state = {
      campus: '雙溪校區',
      filter: 'ALL',
      stores: JSON.parse(JSON.stringify(DEFAULT_STORES)),
      orders: [
        {
          orderId: 'ORD-101', pickupNumber: 'S208', storeId: 'S02', storeName: '雙溪-丼物園',
          itemsJson: JSON.stringify([{ name: '炙燒起司牛五花丼', price: 115, qty: 1 }]),
          finalTotal: 115, promoApplied: '🎁 免排隊招待：免費溫泉蛋乙顆',
          pickupTimeSlot: '12:10 下課取餐', paymentMethod: 'LINE Pay', status: '製作中'
        }
      ],
      activeStore: null,
      cart: {},
      merchantPromoMode: 'gift'
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2800);
    }

    function switchView(viewId) {
      ['viewOrder', 'viewTickets', 'viewMerchant'].forEach(id => {
        document.getElementById(id).classList.toggle('active', id === viewId);
        document.getElementById('navBtn-' + id).classList.toggle('active', id === viewId);
      });
      renderAll();
    }

    function switchCampus(campus) {
      state.campus = campus;
      document.getElementById('btnCampus-雙溪校區').classList.toggle('active', campus === '雙溪校區');
      document.getElementById('btnCampus-城中校區').classList.toggle('active', campus === '城中校區');
      renderStoreList();
    }

    function setFilter(f) {
      state.filter = f;
      ['ALL', 'FAST', 'PROMO'].forEach(k => {
        document.getElementById('filter-' + k).classList.toggle('active', k === f);
      });
      renderStoreList();
    }

    // 渲染學生點餐首頁
    function renderStoreList() {
      const campusStores = state.stores.filter(s => s.campus === state.campus);

      // 找出塞車店與推薦免排隊店
      const busyStore = campusStores.find(s => s.avgPrepMinutes >= 20);
      const fastPromoStore = campusStores.find(s => s.avgPrepMinutes <= 6 && s.promoMode !== 'none');
      const tipBox = document.getElementById('aiSmartTipBox');

      if (busyStore && fastPromoStore) {
        tipBox.innerHTML = `
          <div class="smart-tip-card">
            <div>
              <div class="smart-tip-badge">⚡ AI 免排隊推薦</div>
              <div class="smart-tip-title">「${busyStore.name}」目前需苦等 ${busyStore.avgPrepMinutes} 分鐘</div>
              <div class="smart-tip-desc">改點 <strong>${fastPromoStore.name}</strong> 只要 <strong>${fastPromoStore.avgPrepMinutes} 分鐘</strong>，再享 ${fastPromoStore.promoText}</div>
            </div>
            <button class="btn-tip-action" onclick="openStoreMenu('${fastPromoStore.id}')">領優惠點餐 ➔</button>
          </div>
        `;
      } else {
        tipBox.innerHTML = '';
      }

      // 篩選店家
      let list = campusStores;
      if (state.filter === 'FAST') list = list.filter(s => s.avgPrepMinutes <= 6);
      if (state.filter === 'PROMO') list = list.filter(s => s.promoMode !== 'none');

      const container = document.getElementById('storeListContainer');
      container.innerHTML = list.map(s => {
        let waitClass = 'wait-free';
        let waitText = `⚡ 約 ${s.avgPrepMinutes} 分鐘取餐`;
        if (s.avgPrepMinutes >= 20) {
          waitClass = 'wait-full';
          waitText = `🔥 排隊久候 (${s.avgPrepMinutes}分)`;
        } else if (s.avgPrepMinutes >= 10) {
          waitClass = 'wait-mod';
          waitText = `⏳ 約 ${s.avgPrepMinutes} 分鐘`;
        }

        const icon = STORE_ICONS[s.id] || '🍱';
        const hasPromo = s.promoMode !== 'none' && s.avgPrepMinutes <= 10;

        return `
          <div class="store-card" onclick="openStoreMenu('${s.id}')">
            <div class="store-thumb">${icon}</div>
            <div class="store-info">
              <div class="store-header-row">
                <div class="store-name">${s.name}</div>
                <span class="wait-pill ${waitClass}">${waitText}</span>
              </div>
              <div class="store-meta">⭐ ${s.rating} ・ ${s.category} ・ 待製 ${s.activeOrders} 單</div>
              ${hasPromo ? `<div class="promo-tag">${s.promoText}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    // 開啟餐廳菜單抽屜
    function openStoreMenu(storeId) {
      const store = state.stores.find(s => s.id === storeId);
      if (!store) return;

      state.activeStore = store;
      state.cart = {};
      if (store.menus && store.menus.length > 0) {
        state.cart[store.menus[0].id] = 1;
      }

      document.getElementById('sheetStoreName').innerText = store.name;
      document.getElementById('sheetStoreMeta').innerText = `${store.campus} ・ 預估約 ${store.avgPrepMinutes} 分鐘取餐`;

      const promoBanner = document.getElementById('sheetPromoBanner');
      if (store.promoMode !== 'none' && store.avgPrepMinutes <= 10) {
        promoBanner.style.display = 'block';
        promoBanner.innerText = `🎉 本單已自動套用：${store.promoText}`;
      } else {
        promoBanner.style.display = 'none';
      }

      renderSheetMenu();
      document.getElementById('menuModal').classList.add('open');
    }

    function closeMenuModal() {
      document.getElementById('menuModal').classList.remove('open');
    }

    function changeQty(menuId, delta) {
      const cur = state.cart[menuId] || 0;
      const next = Math.max(0, cur + delta);
      if (next === 0) delete state.cart[menuId];
      else state.cart[menuId] = next;
      renderSheetMenu();
    }

    function renderSheetMenu() {
      const store = state.activeStore;
      if (!store) return;

      let subtotal = 0;
      const html = (store.menus || []).map(m => {
        const qty = state.cart[m.id] || 0;
        subtotal += m.price * qty;
        return `
          <div class="menu-item">
            <div>
              <div class="item-title">${m.name}</div>
              <div class="item-price">$${m.price}</div>
            </div>
            <div class="qty-stepper">
              <button class="step-btn" onclick="changeQty('${m.id}', -1)">－</button>
              <span style="font-weight:800; min-width:18px; text-align:center;">${qty}</span>
              <button class="step-btn plus" onclick="changeQty('${m.id}', 1)">＋</button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('sheetMenuContainer').innerHTML = html;

      let discount = 0;
      const noteEl = document.getElementById('sheetDiscountNote');
      if (subtotal > 0 && store.promoMode === 'discount' && store.avgPrepMinutes <= 10) {
        discount = Number(store.promoDiscount) || 10;
        noteEl.innerText = `(已折 -$${discount})`;
      } else {
        noteEl.innerText = '';
      }

      document.getElementById('sheetTotalPrice').innerText = `$${Math.max(0, subtotal - discount)}`;
    }

    async function placeOrder() {
      const store = state.activeStore;
      if (!store) return;

      const items = [];
      let subtotal = 0;
      (store.menus || []).forEach(m => {
        const q = state.cart[m.id] || 0;
        if (q > 0) {
          items.push({ id: m.id, name: m.name, price: m.price, qty: q });
          subtotal += m.price * q;
        }
      });

      if (items.length === 0) {
        showToast('請至少選擇一項餐點');
        return;
      }

      const discount = (store.promoMode === 'discount' && store.avgPrepMinutes <= 10) ? (Number(store.promoDiscount) || 10) : 0;
      const finalTotal = Math.max(0, subtotal - discount);
      const promoApplied = (store.promoMode !== 'none' && store.avgPrepMinutes <= 10) ? store.promoText : '一般預訂';
      const pickupTimeSlot = document.getElementById('pickupSlotSelect').value;
      const paymentMethod = document.getElementById('paymentSelect').value;

      const prefix = store.campus === '城中校區' ? 'C' : 'S';
      const pickupNumber = prefix + Math.floor(100 + Math.random() * 899);

      const newOrder = {
        orderId: 'ORD-' + Date.now(),
        pickupNumber,
        storeId: store.id,
        storeName: store.name,
        itemsJson: JSON.stringify(items),
        subtotal,
        discount,
        finalTotal,
        promoApplied,
        pickupTimeSlot,
        paymentMethod,
        status: '製作中'
      };

      state.orders.unshift(newOrder);
      store.activeOrders += 1;

      closeMenuModal();
      switchView('viewTickets');
      showToast(`✅ 預訂成功！取餐號碼：${pickupNumber}`);

      // 背景同步至 Google Sheet
      try {
        fetch(GAS_URL, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'submitOrder',
            campus: store.campus,
            storeId: store.id,
            storeName: store.name,
            studentName: '楊定豊',
            items,
            subtotal,
            discount,
            finalTotal,
            promoApplied,
            paymentMethod,
            pickupTimeSlot,
            isDivertedOrder: store.promoMode !== 'none'
          })
        });
      } catch (e) {}
    }

    // 渲染我的取餐號碼牌
    function renderTickets() {
      document.getElementById('ticketCount').innerText = state.orders.length;
      const box = document.getElementById('ticketsContainer');
      if (state.orders.length === 0) {
        box.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:40px 0;">尚無取餐單</p>';
        return;
      }

      box.innerHTML = state.orders.map(o => {
        let items = [];
        try { items = JSON.parse(o.itemsJson || '[]'); } catch (e) {}
        const itemText = items.map(i => `${i.name} x${i.qty}`).join('、');

        const isReady = o.status === '可取餐';
        return `
          <div class="ticket-card">
            <div class="ticket-number-box">
              <div style="font-size:0.7rem; font-weight:700;">取餐號</div>
              <div class="num">${o.pickupNumber}</div>
            </div>
            <div style="flex:1;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                <strong style="font-size:1.02rem;">${o.storeName}</strong>
                <span class="wait-pill ${isReady ? 'wait-free' : 'wait-mod'}">${isReady ? '🔔 可立即取餐' : '🍳 廚房製作中'}</span>
              </div>
              <div style="font-size:0.88rem; font-weight:600; margin-bottom:4px;">${itemText}</div>
              <div style="font-size:0.78rem; color:var(--text-secondary);">
                ${o.promoApplied} ・ ${o.pickupTimeSlot} ・ <strong>$${o.finalTotal}</strong>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 渲染店家接單頁籤
    function initMerchantSelect() {
      const sel = document.getElementById('merchantSelect');
      if (sel.options.length === 0) {
        sel.innerHTML = state.stores.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
        sel.value = 'S02';
      }
    }

    function renderMerchantView() {
      initMerchantSelect();
      const storeId = document.getElementById('merchantSelect').value;
      const store = state.stores.find(s => s.id === storeId) || state.stores[0];
      if (!store) return;

      document.getElementById('merchPredictLabel').innerText = `🤖 AI 今日備料預測：${store.predictedDailyOrders || 160} 份`;
      setMerchantPromo(store.promoMode || 'none', false);
      document.getElementById('merchCustomText').value = store.promoText || '';

      const storeOrders = state.orders.filter(o => o.storeId === store.id);
      const listEl = document.getElementById('merchantOrderList');
      if (storeOrders.length === 0) {
        listEl.innerHTML = '<p style="color:var(--text-muted); font-size:0.86rem; text-align:center; padding:16px;">目前無待製餐點</p>';
        return;
      }

      listEl.innerHTML = storeOrders.map(o => {
        let items = [];
        try { items = JSON.parse(o.itemsJson || '[]'); } catch (e) {}
        const itemText = items.map(i => `${i.name} x${i.qty}`).join('、');

        return `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); gap:10px; flex-wrap:wrap;">
            <div>
              <strong style="color:var(--brand); font-size:1rem;">#${o.pickupNumber}</strong>
              <span style="font-weight:700; margin-left:6px;">${itemText}</span>
              <div style="font-size:0.78rem; color:var(--text-secondary);">${o.promoApplied} ・ ${o.pickupTimeSlot}</div>
            </div>
            <div style="display:flex; gap:6px;">
              <button class="filter-chip" onclick="speakOrder('${o.pickupNumber}', '${itemText}')">🔊 讀單</button>
              <button class="btn-tip-action" style="padding:6px 12px; font-size:0.8rem;" onclick="markOrderReady('${o.orderId}', '${o.pickupNumber}')">🔔 通知取餐</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function setMerchantPromo(mode, autoFill = true) {
      state.merchantPromoMode = mode;
      ['none', 'gift', 'discount', 'points'].forEach(k => {
        document.getElementById('pBtn-' + k).classList.toggle('active', k === mode);
      });
      if (autoFill) {
        const input = document.getElementById('merchCustomText');
        if (mode === 'none') input.value = '無優惠';
        if (mode === 'gift') input.value = '🎁 免排隊招待：免費招牌冰紅茶/溫泉蛋';
        if (mode === 'discount') input.value = '💰 免排隊折抵：現折 $10 元';
        if (mode === 'points') input.value = '🪙 免排隊回饋：雙倍點數';
      }
    }

    function saveMerchantPromo() {
      const storeId = document.getElementById('merchantSelect').value;
      const store = state.stores.find(s => s.id === storeId);
      if (!store) return;

      store.promoMode = state.merchantPromoMode;
      store.promoText = document.getElementById('merchCustomText').value.trim();
      store.promoDiscount = state.merchantPromoMode === 'discount' ? 10 : 0;

      renderAll();
      showToast(`已更新「${store.name}」的分流優惠！`);

      try {
        fetch(GAS_URL, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'updateStoreConfig',
            storeId: store.id,
            promoMode: store.promoMode,
            promoText: store.promoText,
            promoDiscount: store.promoDiscount
          })
        });
      } catch (e) {}
    }

    function markOrderReady(orderId, pickupNo) {
      const ord = state.orders.find(o => o.orderId === orderId);
      if (ord) ord.status = '可取餐';
      renderAll();
      speakOrder(pickupNo, '餐點已製作完成，請至快速櫃檯取餐');
      showToast(`已通知 #${pickupNo} 取餐`);
    }

    function speakOrder(pickupNo, text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(`取餐號 ${pickupNo}，${text}`);
      u.lang = 'zh-TW';
      window.speechSynthesis.speak(u);
    }

    function speakSample() {
      speakOrder('S208', '炙燒起司牛五花丼一份，分流招待免費溫泉蛋乙顆');
      showToast('🔊 正在播放廚房語音讀單');
    }

    async function syncCloud() {
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'initBundle' })
        });
        const data = await res.json();
        if (data && data.bundle && data.bundle.stores) {
          state.stores = data.bundle.stores;
          if (data.bundle.orders && data.bundle.orders.length > 0) {
            state.orders = data.bundle.orders;
          }
          renderAll();
        }
      } catch (e) {}
    }

    function renderAll() {
      renderStoreList();
      renderTickets();
      renderMerchantView();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderAll();
      syncCloud();
    });
  </script>
</body>
</html>
